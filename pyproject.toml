[project]
name = "secondlook"
version = "0.1.0"
description = "Second Look: live football companion with competing scout agents, an Editor and a fail-closed checker (synthetic data only)."
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.7",
  "numpy>=1.26",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "sse-starlette>=2.0",
  "httpx>=0.27",
  "agent-framework>=1.21,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.4", "playwright>=1.44"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
  "live: calls a real LLM provider; manual only",
  "e2e: browser end-to-end test (Playwright + Chromium)",
  "slow: long-running checks (make realism)",
]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501"]
